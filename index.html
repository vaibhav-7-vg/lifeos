<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="LifeOS — your personal life operating system.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>LifeOS</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--primary:#111827;--soft:#eef2ff;--danger:#dc2626;--success:#059669;--warning:#d97706;--shadow:0 8px 28px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1150px;margin:auto;padding-bottom:95px}.top{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.94);backdrop-filter:blur(14px);padding:14px 18px;border-bottom:1px solid var(--line)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:850;font-size:22px}.sub{color:var(--muted);font-size:12px}.iconbtn,.pillbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}.content{padding:18px}.hero{background:var(--primary);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.hero .muted{color:#cbd5e1}.balance{font-size:38px;font-weight:850;margin:8px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.metric{font-size:22px;font-weight:800;margin-top:4px}.label{color:var(--muted);font-size:12px}.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionhead h2{font-size:18px;margin:0}.btn{background:var(--primary);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}.btn.secondary{background:#eef2f6;color:var(--text)}.btn.danger{background:#fee2e2;color:#991b1b}.list{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}.rowmain{min-width:0}.title{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:16px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px max(10px,calc((100vw - 1150px)/2));display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{background:none;color:var(--muted);padding:7px 3px;border-radius:12px;font-size:11px}.nav button.active{background:#eef2ff;color:#111827;font-weight:800}.nav span{display:block;font-size:20px}.fab{position:fixed;right:20px;bottom:78px;width:58px;height:58px;border-radius:50%;background:#111827;color:white;font-size:27px;box-shadow:0 12px 28px rgba(0,0,0,.2);z-index:21}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px}.sheet h2{margin-top:0}.form{display:grid;gap:11px}.form label{font-size:12px;font-weight:700;color:#475467}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;background:#fff}.form textarea{min-height:90px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:11px}.good{color:var(--success)}.warn{color:var(--warning)}.bad{color:var(--danger)}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:999px}.tabs button.on{background:#111827;color:#fff}.search{margin-bottom:12px}.search input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px}.check{width:20px;height:20px}.progress{height:8px;background:#eef2f6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#111827}.dangerbox{background:#fff1f2;border:1px solid #fecdd3;border-radius:16px;padding:14px}.successbox{background:#ecfdf3;border:1px solid #a7f3d0;border-radius:16px;padding:14px}.small{font-size:12px}.desktopOnly{display:block}
@media(max-width:700px){.content{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.hero{border-radius:20px}.balance{font-size:32px}.desktopOnly{display:none}.twocol{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="brand">LifeOS</div><div class="sub">Your life. Organized, connected & protected.</div></div><button class="iconbtn" onclick="openPage('settings')">⚙️</button></div></header>
<main id="view" class="content"></main>
</div>
<button class="fab" onclick="openAdd()">+</button>
<nav class="nav">
<button id="n-home" onclick="openPage('home')"><span>🏠</span>Home</button>
<button id="n-life" onclick="openPage('life')"><span>📋</span>Life</button>
<button id="n-money" onclick="openPage('money')"><span>💰</span>Money</button>
<button id="n-people" onclick="openPage('people')"><span>👥</span>People</button>
<button id="n-more" onclick="openPage('more')"><span>⋯</span>More</button>
</nav>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div id="sheet" class="sheet"></div></div>
<script>
const KEY='lifeos_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[],events:[],reminders:[],transactions:[],loans:[],goals:[],people:[],docs:[],assets:[],receipts:[],connections:[],notes:[],settings:{name:'',currency:'INR',theme:'light'}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:db.settings.currency||'INR',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString():''; 
function openPage(p){window.page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let n=p==='home'?'home':p==='life'?'life':p==='money'?'money':p==='people'?'people':'more';document.getElementById('n-'+n)?.classList.add('active');render()}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function formModal(title,fields,submit){openModal(`<h2>${title}</h2><form class="form" id="theform">${fields}</form>`);document.getElementById('theform').insertAdjacentHTML('beforeend',`<div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">${submit||'Save'}</button></div>`)}
function openAdd(){openModal(`<h2>Add to LifeOS</h2><div class="grid2">${[['💰','Money','money'],['📋','Task','task'],['🔔','Reminder','reminder'],['📅','Event','event'],['👤','Person','person'],['🤝','Lending','loan'],['🎯','Goal','goal'],['📄','Document','doc'],['📦','Asset','asset'],['🧾','Receipt','receipt'],['👥','Connection','connection'],['📝','Note','note']].map(x=>`<button class="card" onclick="closeModal();openAddType('${x[2]}')"><div style="font-size:26px">${x[0]}</div><div class="title">${x[1]}</div></button>`).join('')}</div>`)}
function openAddType(t){
 const common={task:`<label>Task<input name="title" required placeholder="e.g. Finish assignment"></label><label>Due date<input type="date" name="date"></label>`,
 reminder:`<label>Reminder<input name="title" required></label><label>Date<input type="date" name="date"></label><label>Repeat<select name="repeat"><option>None</option><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Yearly</option></select></label>`,
 event:`<label>Event<input name="title" required></label><div class="twocol"><label>Date<input type="date" name="date"></label><label>Time<input type="time" name="time"></label></div><label>Place<input name="place"></label>`,
 person:`<label>Name<input name="name" required></label><label>Phone<input name="phone" inputmode="tel"></label><label>Email<input name="email" type="email"></label><label>Notes<textarea name="notes"></textarea></label>`,
 loan:`<label>Person<input name="person" required></label><div class="twocol"><label>Amount<input name="amount" type="number" step="0.01" required></label><label>Expected back<input name="expected" type="number" step="0.01"></label></div><div class="twocol"><label>Date given<input name="date" type="date"></label><label>Return date<input name="returnDate" type="date"></label></div><label>Extra/interest<input name="extra" type="number" step="0.01"></label>`,
 goal:`<label>Goal<input name="title" required></label><div class="twocol"><label>Target<input name="target" type="number" required></label><label>Current<input name="current" type="number" value="0"></label></div><label>Target date<input name="date" type="date"></label>`,
 doc:`<label>Document name<input name="title" required></label><label>Category<input name="category" placeholder="Identity, Vehicle, Work..."></label><label>Expiry date<input name="expiry" type="date"></label><label>Reference/notes<textarea name="notes"></textarea></label>`,
 asset:`<label>Item<input name="title" required></label><div class="twocol"><label>Purchase price<input name="price" type="number"></label><label>Current value<input name="value" type="number"></label></div><label>Warranty expiry<input name="warranty" type="date"></label><label>Notes<textarea name="notes"></textarea></label>`,
 receipt:`<label>Merchant<input name="merchant"></label><div class="twocol"><label>Total<input name="amount" type="number" step="0.01"></label><label>Date<input name="date" type="date"></label></div><label>Items<textarea name="items" placeholder="Type items from receipt"></textarea></label>`,
 connection:`<label>What do you want to do?<input name="intent" required placeholder="Study, badminton, gaming..."></label><div class="twocol"><label>Date<input name="date" type="date"></label><label>Approx. time<input name="time" type="time"></label></div><label>Area (not exact address)<input name="area"></label>`,
 note:`<label>Title<input name="title" required></label><label>Note<textarea name="body" required></textarea></label>`,
 money:`<label>Type<select name="type"><option value="income">Income</option><option value="expense">Expense</option><option value="transfer">Transfer</option></select></label><label>Description<input name="title" required></label><label>Amount<input name="amount" type="number" step="0.01" required></label><label>Date<input name="date" type="date" value="${today()}"></label><label>Category<input name="category" placeholder="Food, salary, rent..."></label>`};
 formModal(t[0].toUpperCase()+t.slice(1),common[t],t==='connection'?'Post request':'Save');
 document.getElementById('theform').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id();o.created=new Date().toISOString();if(t==='money')db.transactions.push(o);else if(t==='task')db.tasks.push({...o,done:false});else if(t==='reminder')db.reminders.push(o);else if(t==='event')db.events.push(o);else if(t==='person')db.people.push(o);else if(t==='loan')db.loans.push({...o,returned:false});else if(t==='goal')db.goals.push(o);else if(t==='doc')db.docs.push(o);else if(t==='asset')db.assets.push(o);else if(t==='receipt')db.receipts.push(o);else if(t==='connection')db.connections.push(o);else db.notes.push(o);save();closeModal();render()};
}
function remove(type,x){db[type]=db[type].filter(a=>a.id!==x);save();render()}
function toggleTask(x){let a=db.tasks.find(a=>a.id===x);if(a)a.done=!a.done;save();render()}
function moneyTotals(){let income=db.transactions.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0), expense=db.transactions.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);let assets=db.assets.reduce((s,x)=>s+Number(x.value||x.price||0),0);return{income,expense,assets,balance:income-expense+assets}}
function render(){let v=document.getElementById('view'); if(window.page==='life')return renderLife(v);if(window.page==='money')return renderMoney(v);if(window.page==='people')return renderPeople(v);if(window.page==='more')return renderMore(v);renderHome(v)}
function renderHome(v){let t=moneyTotals(),pending=db.tasks.filter(x=>!x.done).length,soon=db.docs.filter(x=>x.expiry&&x.expiry<=new Date(Date.now()+45*864e5).toISOString().slice(0,10)).length;v.innerHTML=`<section class="hero"><div class="muted">LifeOS Command Center</div><h1 style="margin:5px 0">${db.settings.name?`Good day, ${esc(db.settings.name)} 👋`:'Good day 👋'}</h1><div class="label muted">Tracked net position</div><div class="balance">${money(t.balance)}</div><div class="actions"><button class="btn" onclick="openAdd()">＋ Add</button><button class="btn secondary" onclick="openPage('ai')">🤖 Ask LifeOS</button></div></section><section class="section"><div class="grid"><div class="card"><div class="label">Tasks</div><div class="metric">${pending}</div></div><div class="card"><div class="label">Upcoming docs</div><div class="metric">${soon}</div></div><div class="card"><div class="label">To receive</div><div class="metric">${money(db.loans.filter(x=>!x.returned).reduce((s,x)=>s+Number(x.expected||x.amount||0),0))}</div></div><div class="card"><div class="label">Goals</div><div class="metric">${db.goals.length}</div></div></div></section><section class="section"><div class="sectionhead"><h2>Today</h2><button class="pillbtn" onclick="openPage('life')">View life</button></div><div class="list">${todayRows()}</div></section><section class="section grid2"><div class="card"><div class="sectionhead"><h2>Money snapshot</h2><span>💰</span></div><div class="row"><span>Income</span><b>${money(t.income)}</b></div><div class="row"><span>Expenses</span><b>${money(t.expense)}</b></div><div class="row"><span>Assets</span><b>${money(t.assets)}</b></div></div><div class="card"><div class="sectionhead"><h2>Quick safety</h2><span>🛡️</span></div><p class="small">Received a suspicious message or link?</p><button class="btn" onclick="openPage('safety')">Check it</button></div></section>`}
function todayRows(){let a=[...db.tasks.filter(x=>!x.done&&(!x.date||x.date===today())).map(x=>`<div class="row"><div class="rowmain"><div class="title">📋 ${esc(x.title)}</div><div class="meta">Task ${x.date?'• '+fmt(x.date):''}</div></div><button class="pillbtn" onclick="toggleTask('${x.id}')">Done</button></div>`),b=db.reminders.filter(x=>x.date===today()).map(x=>`<div class="row"><div><div class="title">🔔 ${esc(x.title)}</div><div class="meta">Reminder</div></div></div>`),c=db.events.filter(x=>x.date===today()).map(x=>`<div class="row"><div><div class="title">📅 ${esc(x.title)}</div><div class="meta">${esc(x.time||'')}</div></div></div>`);return (a.concat(b,c).slice(0,6).join(''))||`<div class="empty">Nothing urgent today. Nice. 🎉</div>`}
function renderLife(v){v.innerHTML=`<div class="sectionhead"><h1>📋 Life</h1><button class="btn" onclick="openAddType('task')">＋ Task</button></div><div class="tabs"><button class="on">Tasks</button><button onclick="openPage('calendar')">Calendar</button><button onclick="openPage('reminders')">Reminders</button><button onclick="openPage('lists')">Lists</button></div><div class="list">${db.tasks.length?db.tasks.slice().sort((a,b)=>(a.done-b.done)||String(a.date).localeCompare(String(b.date))).map(x=>`<div class="row"><input class="check" type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><div class="rowmain"><div class="title" style="${x.done?'text-decoration:line-through;color:#98a2b3':''}">${esc(x.title)}</div><div class="meta">${x.date?fmt(x.date):'No due date'}</div></div><button class="pillbtn" onclick="remove('tasks','${x.id}')">🗑</button></div>`).join(''):`<div class="empty">No tasks yet. Add your first task.</div>`}</div>`}
function renderMoney(v){let t=moneyTotals();v.innerHTML=`<div class="sectionhead"><h1>💰 Money</h1><button class="btn" onclick="openAddType('money')">＋ Money</button></div><div class="grid"><div class="card"><div class="label">Net tracked</div><div class="metric">${money(t.balance)}</div></div><div class="card"><div class="label">Income</div><div class="metric good">${money(t.income)}</div></div><div class="card"><div class="label">Expenses</div><div class="metric bad">${money(t.expense)}</div></div><div class="card"><div class="label">Assets</div><div class="metric">${money(t.assets)}</div></div></div><section class="section grid2"><div class="card"><div class="sectionhead"><h2>🤝 Money to receive</h2><button class="pillbtn" onclick="openAddType('loan')">＋</button></div>${db.loans.length?db.loans.map(x=>`<div class="row"><div><div class="title">${esc(x.person)}</div><div class="meta">${money(x.amount)} • expected ${money(x.expected||x.amount)} • ${x.returnDate?fmt(x.returnDate):'no date'}</div></div><div class="actions">${x.returned?'<span class="tag good">Returned</span>':`<button class="pillbtn" onclick="markLoan('${x.id}')">Returned</button>`}</div></div>`).join(''):'<div class="empty">No lending records.</div>'}</div><div class="card"><div class="sectionhead"><h2>🎯 Goals</h2><button class="pillbtn" onclick="openAddType('goal')">＋</button></div>${db.goals.length?db.goals.map(x=>{let p=Math.min(100,(Number(x.current)/Number(x.target||1))*100);return `<div class="row"><div style="width:100%"><div class="title">${esc(x.title)}</div><div class="meta">${money(x.current)} / ${money(x.target)}</div><div class="progress"><i style="width:${p}%"></i></div></div></div>`}).join(''):'<div class="empty">No savings goals.</div>'}</div></section><section class="section card"><div class="sectionhead"><h2>Transactions</h2></div>${db.transactions.length?db.transactions.slice().reverse().map(x=>`<div class="row"><div><div class="title">${x.type==='income'?'⬆️':'⬇️'} ${esc(x.title)}</div><div class="meta">${fmt(x.date)} • ${esc(x.category||'')}</div></div><b class="${x.type==='income'?'good':'bad'}">${x.type==='income'?'+':'-'}${money(x.amount)}</b></div>`).join(''):'<div class="empty">No transactions yet.</div>'}</section>`}
function markLoan(x){let a=db.loans.find(a=>a.id===x);if(a)a.returned=true;save();render()}
function renderPeople(v){v.innerHTML=`<div class="sectionhead"><h1>👥 People</h1><button class="btn" onclick="openAddType('person')">＋ Person</button></div><div class="card"><h2>ConnectCircle</h2><p class="small">Post an activity request without exposing your exact location.</p><button class="btn" onclick="openAddType('connection')">＋ Find people</button></div><section class="section"><div class="list">${db.people.length?db.people.map(x=>`<div class="row"><div><div class="title">👤 ${esc(x.name)}</div><div class="meta">${esc(x.phone||'')}${x.email?' • '+esc(x.email):''}</div></div><button class="pillbtn" onclick="remove('people','${x.id}')">🗑</button></div>`).join(''):'<div class="empty">No people added.</div>'}</div></section><section class="section card"><h2>Requests</h2>${db.connections.length?db.connections.map(x=>`<div class="row"><div><div class="title">🤝 ${esc(x.intent)}</div><div class="meta">${esc(x.area||'Area not specified')} • ${x.date?fmt(x.date):'Any date'}</div></div><button class="pillbtn" onclick="remove('connections','${x.id}')">Remove</button></div>`).join(''):'<div class="empty">No connection requests.</div>'}</section>`}
function renderMore(v){v.innerHTML=`<h1>⋯ More</h1><div class="grid2">${[['📄','Documents','documents'],['📦','Assets & Warranty','assets'],['🧾','Receipts','receipts'],['🛡️','Safety Check','safety'],['📊','Insights','insights'],['🤖','LifeOS AI','ai'],['📝','Notes','notes'],['⚙️','Settings','settings']].map(x=>`<button class="card" onclick="openPage('${x[2]}')"><div style="font-size:28px">${x[0]}</div><div class="title">${x[1]}</div><div class="meta">Open module</div></button>`).join('')}</div>`}
function renderSub(p){let v=document.getElementById('view');if(p==='documents')v.innerHTML=`<div class="sectionhead"><h1>📄 Documents</h1><button class="btn" onclick="openAddType('doc')">＋ Document</button></div><div class="list">${db.docs.length?db.docs.map(x=>`<div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.category||'')} ${x.expiry?'• Expires '+fmt(x.expiry):''}</div></div><button class="pillbtn" onclick="remove('docs','${x.id}')">🗑</button></div>`).join(''):'<div class="empty">No documents. Store expiry reminders here; upload files in a future cloud/encrypted version.</div>'}</div>`;
else if(p==='assets')v.innerHTML=`<div class="sectionhead"><h1>📦 Assets</h1><button class="btn" onclick="openAddType('asset')">＋ Asset</button></div><div class="list">${db.assets.length?db.assets.map(x=>`<div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta">Value ${money(x.value||x.price)} ${x.warranty?'• Warranty '+fmt(x.warranty):''}</div></div><button class="pillbtn" onclick="remove('assets','${x.id}')">🗑</button></div>`).join(''):'<div class="empty">No assets.</div>'}</div>`;
else if(p==='receipts')v.innerHTML=`<div class="sectionhead"><h1>🧾 Receipts</h1><button class="btn" onclick="openAddType('receipt')">＋ Receipt</button></div><div class="list">${db.receipts.length?db.receipts.map(x=>`<div class="row"><div><div class="title">${esc(x.merchant||'Receipt')}</div><div class="meta">${x.date?fmt(x.date):''} • ${money(x.amount)}</div></div><button class="pillbtn" onclick="remove('receipts','${x.id}')">🗑</button></div>`).join(''):'<div class="empty">No receipts.</div>'}</div>`;
else if(p==='safety')v.innerHTML=`<h1>🛡️ Safety Check</h1><div class="card"><p>Paste a suspicious message, email, URL or QR text. This offline checker looks for common warning patterns; it is not a guarantee.</p><textarea id="safetyText" style="width:100%;min-height:150px;padding:12px;border:1px solid #d0d5dd;border-radius:12px" placeholder="Paste the message or link here..."></textarea><button class="btn" style="margin-top:10px" onclick="checkSafety()">Analyze</button><div id="safetyResult"></div></div>`;
else if(p==='insights'){let t=moneyTotals(),food=db.transactions.filter(x=>/food|restaurant|coffee|grocery|meal/i.test(x.category+' '+x.title)).reduce((s,x)=>s+Number(x.amount),0);v.innerHTML=`<h1>📊 Insights</h1><div class="grid2"><div class="card"><div class="label">Savings rate</div><div class="metric">${t.income?Math.round((t.income-t.expense)/t.income*100):0}%</div><p class="small">Based on tracked income and expenses.</p></div><div class="card"><div class="label">Food-related spending</div><div class="metric">${money(food)}</div><p class="small">Category/title keyword estimate.</p></div></div><div class="section card"><h2>Smart suggestions</h2><ul><li>Review recurring expenses monthly.</li><li>Set an emergency-fund goal.</li><li>Add expiry dates for important documents.</li><li>Use Safety Check before acting on unexpected payment requests.</li></ul></div>`}
else if(p==='ai')v.innerHTML=`<h1>🤖 Ask LifeOS</h1><div class="card"><p class="small">This starter version answers using your local LifeOS data. A future version can connect a privacy-controlled AI API.</p><input id="aiq" style="width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px" placeholder="e.g. What do I need to do today?"><button class="btn" style="margin-top:10px" onclick="askAI()">Ask</button><div id="aiout"></div></div>`;
else if(p==='notes')v.innerHTML=`<div class="sectionhead"><h1>📝 Notes</h1><button class="btn" onclick="openAddType('note')">＋ Note</button></div><div class="list">${db.notes.length?db.notes.map(x=>`<div class="card"><div class="sectionhead"><h3>${esc(x.title)}</h3><button class="pillbtn" onclick="remove('notes','${x.id}')">🗑</button></div><p>${esc(x.body)}</p></div>`).join(''):'<div class="empty">No notes.</div>'}`;
else if(p==='settings')v.innerHTML=`<h1>⚙️ Settings</h1><div class="card"><div class="form"><label>Your name<input id="setname" value="${esc(db.settings.name)}"></label><label>Currency<select id="setcur">${['INR','USD','EUR','GBP','JPY','AUD','CAD','SGD','AED'].map(c=>`<option ${db.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></label><button class="btn" onclick="saveSettings()">Save settings</button><button class="btn secondary" onclick="exportData()">Export my data</button><button class="btn danger" onclick="resetData()">Delete all local data</button></div></div><p class="small">LifeOS starter stores data in this browser's localStorage. Do not store highly sensitive documents until encrypted storage and secure authentication are added.</p>`;
else if(p==='calendar')v.innerHTML=`<h1>📅 Calendar</h1><div class="list">${db.events.length?db.events.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>`<div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta">${x.date?fmt(x.date):''} ${esc(x.time||'')} ${esc(x.place||'')}</div></div><button class="pillbtn" onclick="remove('events','${x.id}')">🗑</button></div>`).join(''):'<div class="empty">No events.</div>'}`;
else if(p==='reminders')v.innerHTML=`<div class="sectionhead"><h1>🔔 Reminders</h1><button class="btn" onclick="openAddType('reminder')">＋ Reminder</button></div><div class="list">${db.reminders.length?db.reminders.map(x=>`<div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta">${x.date?fmt(x.date):''} • ${esc(x.repeat||'None')}</div></div><button class="pillbtn" onclick="remove('reminders','${x.id}')">🗑</button></div>`).join(''):'<div class="empty">No reminders.</div>'}`;
else if(p==='lists')v.innerHTML=`<h1>🛒 Lists</h1><div class="card"><p>Create custom lists using Notes for now. Dedicated list/checklist syncing can be added to the LifeOS data layer later.</p><button class="btn" onclick="openAddType('note')">Create list/note</button></div>`;
}
function checkSafety(){let s=document.getElementById('safetyText').value.toLowerCase(),score=0,reasons=[];[['otp',3],['password',3],['pin',3],['urgent',2],['immediately',2],['click this',2],['verify your account',2],['send money',3],['gift card',3],['crypto',2],['prize',2],['winner',2],['blocked',2],['suspended',2]].forEach(([w,n])=>{if(s.includes(w)){score+=n;reasons.push(w)}});let level=score>=6?'HIGH RISK':score>=3?'SUSPICIOUS':'LOW SIGNAL';document.getElementById('safetyResult').innerHTML=`<div class="${score>=6?'dangerbox':score>=3?'card':'successbox'}" style="margin-top:14px"><h2>${level}</h2><p>Signals detected: ${reasons.length?reasons.join(', '):'No common warning words detected.'}</p><p class="small">Never share OTPs, passwords, PINs or recovery codes with LifeOS or anyone contacting you unexpectedly. This checker cannot prove that a message is safe.</p></div>`}
function askAI(){let q=document.getElementById('aiq').value.toLowerCase(),t=moneyTotals(),out='';if(q.includes('today')||q.includes('do'))out=`You have <b>${db.tasks.filter(x=>!x.done).length}</b> unfinished tasks, <b>${db.reminders.filter(x=>x.date===today()).length}</b> reminders today and <b>${db.events.filter(x=>x.date===today()).length}</b> events today.`;else if(q.includes('owe')||q.includes('receive')||q.includes('lent'))out=`You have <b>${db.loans.filter(x=>!x.returned).length}</b> open lending records totaling <b>${money(db.loans.filter(x=>!x.returned).reduce((s,x)=>s+Number(x.expected||x.amount||0),0))}</b>.`;else if(q.includes('expense')||q.includes('spend'))out=`Tracked expenses are <b>${money(t.expense)}</b> against income of <b>${money(t.income)}</b>.`;else if(q.includes('document')||q.includes('expiry'))out=`You have <b>${db.docs.filter(x=>x.expiry).length}</b> documents with expiry dates.`;else out=`I can currently answer about your tasks, money, lending, expenses and documents. Try: “What do I need to do today?”`;document.getElementById('aiout').innerHTML=`<div class="card" style="margin-top:14px">${out}</div>`}
function saveSettings(){db.settings.name=document.getElementById('setname').value.trim();db.settings.currency=document.getElementById('setcur').value;save();openPage('home')}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lifeos-backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm('Delete ALL LifeOS data from this browser?')){localStorage.removeItem(KEY);location.reload()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.page='home';render();
</script>
</body></html>
